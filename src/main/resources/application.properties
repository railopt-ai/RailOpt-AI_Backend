#spring.application.name=Backend
spring.application.name=railopt-ai-backend

# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/railopt_ai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Migration location
spring.flyway.locations=classpath:db/migration


# Jackson / JSON

# Logging
logging.level.root=INFO
logging.level.com.railopt.ai=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO


# Firebase Authentication
# Firebase Admin SDK configuration will be added here.
# Keep service-account credentials OUT of Git.
#
# Example:
# firebase.project-id=YOUR_FIREBASE_PROJECT_ID
#
# Do not put the Firebase private key directly in this file.


# Python AI/ML Service
# Spring Boot will call the Python service through REST APIs.
#
# Example:
# ai.service.base-url=http://localhost:8000


# Actuator
# Add Actuator configuration later if Spring Boot Actuator
# is included in pom.xml.

