          type: string
          format: uuid
          description: Scheduling run identifier
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        created_by:
          type: string
          format: uuid
          description: User who initiated the scheduling run
          example: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
        run_code:
          type: string
          description: Scheduling run code
          example: "SR-2026-09-01"
        algorithm_type:
          type: string
          description: Algorithm used for optimization
          example: "CP-SAT"
        status:
          type: string
          description: Lifecycle status of the scheduling run
          example: "COMPLETED"
        planning_start_at:
          type: string
          format: date-time
          description: Start of planning window
          example: "2026-09-15T00:00:00Z"
        planning_end_at:
          type: string
          format: date-time
          description: End of planning window
          example: "2026-09-22T00:00:00Z"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Execution start timestamp
          example: "2026-09-15T01:00:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Execution completion timestamp
          example: "2026-09-15T01:15:00Z"
        objective_description:
          type: string
          description: High-level description of optimization objective
          example: "Maximize asset availability and minimize train disruption"
        objective_weights:
          type: object
          additionalProperties: true
          description: Key-value weights for solver objectives
        total_tasks_considered:
          type: integer
          description: Total maintenance tasks evaluated
          example: 12
        total_tasks_scheduled:
          type: integer
          description: Total maintenance tasks successfully scheduled
          example: 10
        total_tasks_unscheduled:
          type: integer
          description: Tasks that could not be scheduled
          example: 2
        error_message:
          type: string
          nullable: true
          description: Error details if run failed

    SchedulingRunTaskResponse:
      type: object
      properties:
        scheduling_run_id:
          type: string
          format: uuid
          description: Scheduling run identifier
