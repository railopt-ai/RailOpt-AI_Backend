          format: uuid
          description: Unique train type identifier
          example: "f6c2a58f-045a-4c2f-d20e-4d2b0a1a8d06"
        code:
          type: string
          description: Train type code
          example: "EXP"
        name:
          type: string
          description: Train type name
          example: "Express Passenger"
        description:
          type: string
          description: Detailed description
          example: "Long-distance express passenger train"
        category:
          type: string
          description: Category classification
          example: "PASSENGER"
        priority_class:
          type: string
          description: Priority classification for dispatching
          example: "HIGH"

    TrainResponse:
