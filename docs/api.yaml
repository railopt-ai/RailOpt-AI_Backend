          example: "Routine signal inspection"
        scheduled_start:
          type: string
          format: date-time
          description: Planned maintenance start time
          example: "2026-09-15T22:00:00Z"
        scheduled_end:
          type: string
          format: date-time
          description: Planned maintenance end time
          example: "2026-09-16T04:00:00Z"

    TrainTypeResponse:
      type: object
