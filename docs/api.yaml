  /infrastructure/graph:

    get:
      tags:
        - Infrastructure

      summary: Get railway infrastructure graph

      description: |
        Returns a lightweight graph representation of the railway
        infrastructure for graphical visualization in the frontend.

        The response contains infrastructure nodes and the
        relationships between them.

        Nodes may represent stations, tracks, blocks and other
        infrastructure elements required by the railway topology.

        The response contains only visualization-level information.
        Detailed information about an individual element should be
        retrieved through its corresponding infrastructure endpoint.

      parameters:

        - name: section_id
          in: query
          required: false
          schema:
            type: string
          description: Limit the graph to a specific railway section
          example: "SEC-101"

        - name: include_blocks
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Include railway blocks in the graph

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter graph elements by operational status
          example: "ACTIVE"

      responses:

        "200":
          description: Railway infrastructure graph retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureGraphResponse"
              example:

                nodes:

                  - id: "STN-101"
                    type: "STATION"
                    name: "Pune"
                    status: "ACTIVE"

                  - id: "STN-102"
                    type: "STATION"
                    name: "Khadki"
                    status: "ACTIVE"

                  - id: "TRK-201"
                    type: "TRACK"
                    name: "UP Main Line"
                    status: "ACTIVE"

                  - id: "BLK-301"
                    type: "BLOCK"
                    name: "B-12"
                    status: "AVAILABLE"

                edges:

                  - source: "STN-101"
                    target: "TRK-201"
                    type: "CONNECTED_TO"

                  - source: "TRK-201"
                    target: "BLK-301"
                    type: "CONTAINS"

                  - source: "BLK-301"
                    target: "STN-102"
                    type: "LEADS_TO"

        "400":
          description: Invalid graph query parameters

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Requested infrastructure section not found

        "500":
          description: Internal server error while constructing the infrastructure graph



  # =====================================================
  # ASSETS MODULE
  # =====================================================


  /asset:

    get:
      tags:
        - Assets

      summary: List railway assets

      description: |
        Returns a paginated list of railway assets.

        Assets can be filtered by asset type, operational status,
        track section and station.

      parameters:

        - name: asset_type_id
          in: query
          required: false
          schema:
            type: string
          description: Filter assets by asset type
          example: "AT-01"

        - name: track_section_id
          in: query
          required: false
          schema:
            type: string
          description: Filter assets associated with a track section
          example: "TS-101"

        - name: station_id
          in: query
          required: false
          schema:
            type: string
          description: Filter assets associated with a station
          example: "STN-101"

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter assets by operational status
          example: "ACTIVE"

        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search assets by name or code
          example: "SIG-102"

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of assets per page

      responses:

        "200":
          description: Assets retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetResponse"

        "400":
          description: Invalid query parameters

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions


    post:
      tags:
        - Assets

      summary: Create railway asset

      description: |
        Creates a new railway asset.

        The asset may be associated with a track section and/or
        station according to the infrastructure model.

        The asset type must reference an existing asset type.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_type_id
              properties:

                asset_type_id:
                  type: string
                  description: Asset type identifier
                  example: "AT-01"

                track_section_id:
                  type: string
                  nullable: true
                  description: Track section associated with the asset
                  example: "TS-101"

                station_id:
                  type: string
                  nullable: true
                  description: Station associated with the asset
                  example: "STN-101"

                name:
                  type: string
                  description: Asset name
                  example: "Signal S-102"

                code:
                  type: string
                  description: Unique asset code
                  example: "SIG-102"

      responses:

        "201":
          description: Railway asset created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"

        "400":
          description: Invalid asset data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Referenced asset type or infrastructure element not found

        "409":
          description: Asset with the same identifier already exists


  /asset/{assetId}:

    get:
      tags:
        - Assets

      summary: Get railway asset

      description: |
        Returns the required information for a specific railway asset.

        The response is intended for asset details and frontend
        asset inspection without exposing unnecessary database fields.

      parameters:

        - name: assetId
          in: path
          required: true
          schema:
            type: string
          description: Asset identifier
          example: "AST-1024"

      responses:

        "200":
          description: Asset retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Asset not found


    patch:
      tags:
        - Assets

      summary: Update railway asset

      description: |
        Updates editable information of an existing railway asset.

        System-controlled identifiers and historical information
        cannot be modified through this endpoint.

      parameters:

        - name: assetId
          in: path
          required: true
          schema:
            type: string
          description: Asset identifier
          example: "AST-1024"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:

                asset_type_id:
                  type: string
                  description: Asset type identifier
                  example: "AT-01"

                track_section_id:
                  type: string
                  nullable: true
                  description: Track section associated with the asset
                  example: "TS-101"

                station_id:
                  type: string
                  nullable: true
                  description: Station associated with the asset
                  example: "STN-101"

                name:
                  type: string
                  description: Asset name
                  example: "Signal S-102"

                code:
                  type: string
                  description: Unique asset code
                  example: "SIG-102"

      responses:

        "200":
          description: Asset updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"

        "400":
          description: Invalid asset data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Asset or referenced infrastructure element not found

        "409":
          description: Asset update conflicts with existing data


    delete:
      tags:
        - Assets

      summary: Deactivate railway asset

      description: |
        Deactivates a railway asset from active use.

        Historical records associated with the asset are retained
        where required by the system.

      parameters:

        - name: assetId
          in: path
          required: true
          schema:
            type: string
          description: Asset identifier
          example: "AST-1024"

      responses:

        "204":
          description: Asset deactivated successfully

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Asset not found

        "409":
          description: Asset cannot be deactivated because it is referenced by active records


  /asset/by-track-section/{trackSectionId}:

    get:
      tags:
        - Assets

      summary: List assets on a track section

      description: |
        Returns assets associated with a specific track section.

        This endpoint is useful when the frontend displays a
