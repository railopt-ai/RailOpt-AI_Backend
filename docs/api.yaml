openapi: 3.0.3
info:
  title: RailOpt-AI API
  version: 1.0.0
  description: |
    API documentation for RailOpt-A

    RailOpt-AI is an AI-powered automatic block planning system
    designed to maximize asset availability for train operations
    on Indian Railways.

    ## Authentication

    Authentication is handled using **Firebase Authentication**.

    Frontend applications authenticate users using the Firebase SDK.
    After successful authentication, the frontend must send the
    Firebase **ID Token** with every protected API request.

    ### Authorization Header

    ```
    Authorization: Bearer <firebase-id-token>
    ```

    The Spring Boot backend verifies the Firebase ID Token and
    extracts the Firebase UID to identify the authenticated user.

servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/student-79e-e41/RailOpt-AI-V1/1.0.0
  - url: http://localhost:8080
    description: Local development server

components:

  securitySchemes:

    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase Authentication ID Token.

        The frontend must send the token using:
        Authorization: Bearer <firebase-id-token>

  schemas:

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Application error code
          example: BAD_REQUEST
        message:
          type: string
          description: Human-readable error message
          example: Invalid request data
        path:
          type: string
          description: API endpoint where the error occurred
          example: /user

    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: RailOpt-AI user identifier
          example: "USR-1024"
        email:
          type: string
          format: email
          description: User's email address
          example: "planner@railway.gov.in"
        name:
          type: string
          description: User's display name
          example: "Rahul Sharma"
        phone:
          type: string
          nullable: true
          description: User's contact number
          example: "9876543210"
        role:
          type: string
          nullable: true
          description: Role assigned to the user in RailOpt-AI
          example: "PLANNER"
        department_id:
          type: string
          nullable: true
          description: Department associated with the user
          example: "DEP-12"
        status:
          type: string
          description: Current status of the user account
          example: "ACTIVE"

    CreateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
          description: Email associated with the authenticated Firebase account
          example: "planner@railway.gov.in"
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: User's display name
          example: "Rahul Sharma"
        phone:
          type: string
          description: User's contact number
          example: "9876543210"
        role:
          type: string
          description: Initial RailOpt-AI role assigned to the user
          example: "PLANNER"
        department_id:
          type: string
          description: Department assigned to the user
          example: "DEP-12"

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: User's display name
          example: "Rahul Sharma"
        phone:
          type: string
          description: User's contact number
          example: "9876543210"

    AdminUpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: User's display name
          example: "Rahul Sharma"
        phone:
          type: string
          description: User's contact number
          example: "9876543210"
        role:
          type: string
          description: Role assigned to the user
          example: "PLANNER"
        department_id:
          type: string
          description: Department assigned to the user
          example: "DEP-12"

    UpdateUserRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          description: New role assigned to the user
          example: "PLANNER"

    UpdateUserDepartmentRequest:
      type: object
      required:
        - department_id
      properties:
        department_id:
          type: string
          description: Department to which the user is assigned
          example: "DEP-12"

    UpdateUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: New status of the user account
          example: "ACTIVE"

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        total:
          type: integer
          description: Total number of users matching the filters
          example: 25
        page:
          type: integer
          description: Current page number
          example: 0
        size:
          type: integer
          description: Number of users requested per page
          example: 20


    DepartmentResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique department identifier
          example: "DEP-12"
        name:
          type: string
          description: Department name
          example: "Track Maintenance"
        status:
          type: string
          description: Operational status of the department
          example: "ACTIVE"

    SectionResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique railway section identifier
          example: "SEC-101"
        code:
          type: string
          description: Section code
          example: "PN-DN"
        name:
          type: string
          description: Section name
          example: "Pune - Daund"
        status:
          type: string
          description: Section operational status
          example: "ACTIVE"

    TrackResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique track identifier
          example: "TRK-201"
        section_id:
          type: string
          description: Railway section identifier
          example: "SEC-101"
        code:
          type: string
          description: Unique track code
          example: "UP-ML-01"
        name:
          type: string
          description: Track name or identifier
          example: "UP Main Line"
        status:
          type: string
          description: Track operational status
          example: "ACTIVE"

    BlockResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique block identifier
          example: "BLK-B12"
        track_id:
          type: string
          description: Track identifier
          example: "TRK-201"
        code:
          type: string
          description: Unique block code
          example: "BLK-B12"
        name:
          type: string
          description: Block name or identifier
          example: "Block B-12"
        status:
          type: string
          description: Block availability status
          example: "AVAILABLE"

    InfrastructureGraphResponse:
      type: object
      properties:
