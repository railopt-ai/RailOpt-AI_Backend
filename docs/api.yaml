          example: "e5b1f47e-934f-4b1e-c19d-3c1a9f0f7c05"
        asset_id:
          type: string
          format: uuid
          description: Asset requiring maintenance
          example: "b1f7d23a-590b-4d7a-8d5f-9e7c5b6b3e01"
        task_code:
          type: string
          description: Unique maintenance task code
          example: "MNT-2026-001"
        maintenance_type:
          type: string
          description: Type of maintenance
          example: "PREVENTIVE"
        priority:
          type: string
          description: Task priority
          example: "HIGH"
        status:
          type: string
          description: Current lifecycle status of the task
          example: "SCHEDULED"
        description:
          type: string
