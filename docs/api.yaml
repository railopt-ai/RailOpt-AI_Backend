        block_code:
          type: string
          description: Block code
          example: "BLK-01"
        status:
          type: string
          description: Status of block
          example: "CONFIRMED"
        planned_start_at:
          type: string
          format: date-time
          description: Planned start time
          example: "2026-09-16T01:00:00Z"
        planned_end_at:
          type: string
          format: date-time
          description: Planned end time
          example: "2026-09-16T05:00:00Z"
        duration_minutes:
          type: integer
          description: Duration in minutes
          example: 240
        full_block:
          type: boolean
          description: Whether full block is required
          example: true
        power_disconnection:
          type: boolean
          description: Whether OHE power disconnection is required
          example: true
        train_impact_score:
          type: number
          format: double
          description: Impact on train operations
          example: 15.0
        asset_impact_score:
          type: number
          format: double
          description: Impact on asset availability
          example: 5.0
        scheduling_reason:
          type: string
          description: Scheduling explanation
          example: "Coordinated maintenance slot"

    ScheduledBlockResourceResponse:
      type: object
      properties:
        scheduled_block_id:
          type: string
          format: uuid
          description: Scheduled block identifier
          example: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
        resource_id:
          type: string
          format: uuid
          description: Resource identifier
          example: "6f7a8b9c-0d1e-2f3a-4b5c-6d7e8f9a0b1c"
        quantity_allocated:
          type: integer
          description: Number of resource units allocated
          example: 1
        allocated_start_at:
          type: string
          format: date-time
          description: Resource allocation start
          example: "2026-09-16T01:00:00Z"
        allocated_end_at:
          type: string
          format: date-time
          description: Resource allocation end
          example: "2026-09-16T05:00:00Z"

    ScheduleConflictResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Conflict identifier
          example: "7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
        scheduling_run_id:
          type: string
          format: uuid
          description: Scheduling run identifier
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        scheduled_task_id:
          type: string
          format: uuid
          nullable: true
          description: Scheduled task involved in conflict
          example: "3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f"
        scheduled_block_id:
          type: string
          format: uuid
          nullable: true
          description: Scheduled block involved in conflict
          example: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
        train_run_id:
          type: string
          format: uuid
          nullable: true
          description: Train run conflicting with block
          example: "eb17f03e-590f-4b7e-c75d-9c7a5f6f3c11"
        resource_id:
          type: string
          format: uuid
          nullable: true
          description: Resource with contention
        track_section_id:
          type: string
          format: uuid
          nullable: true
          description: Track section affected
        block_section_id:
          type: string
          format: uuid
          nullable: true
          description: Block section affected
          example: "5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b"
        conflict_type:
          type: string
          description: Type of conflict
          example: "TRAIN_BLOCK"
        severity:
          type: string
          description: Conflict severity
          example: "HIGH"
        status:
          type: string
          description: Current resolution status
          example: "RESOLVED"
        description:
          type: string
          description: Conflict description
          example: "Maintenance block overlaps with Train 12123 scheduled run"
        conflict_duration_minutes:
          type: integer
          description: Overlap duration in minutes
          example: 45
        conflict_start_at:
          type: string
          format: date-time
          description: Start of conflict window
          example: "2026-09-16T02:00:00Z"
        conflict_end_at:
          type: string
          format: date-time
          description: End of conflict window
          example: "2026-09-16T02:45:00Z"
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when conflict was resolved
          example: "2026-09-16T01:30:00Z"
security:
  - firebaseAuth: []

tags:
  - name: System
    description: System and health-related operations
  - name: User
    description: Authenticated user and user profile operations
  - name: Organization
    description: Railway organizational structure
  - name: Infrastructure
    description: Railway infrastructure and track-related operations
  - name: Assets
    description: Railway asset management
  - name: Maintenance
    description: Maintenance task and maintenance-related operations
  - name: Train Operations
    description: Train, route, schedule and operational data
  - name: Forecasting
    description: Traffic and operational forecasting
  - name: Scheduling
    description: Automatic block planning and scheduling operations
  - name: Conflicts
    description: Schedule and block conflict detection
  - name: Metrics
    description: Scheduling performance and availability metrics
  - name: AI/ML
    description: Internal AI and machine learning service operations

paths:

  /health:
    get:
      tags:
        - System
      summary: Check API health
      description: |
        Returns the current health status of the RailOpt-AI backend.

        This endpoint is publicly accessible and does not require
        Firebase authentication.
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: UP
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                      USER
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  # =====================================================
  # USER MODULE
  # =====================================================

  /user/me:

    get:
      tags:
        - User

      summary: Get current authenticated user

      description: |
        Returns the RailOpt-AI user associated with the currently
        authenticated Firebase account.

        The Firebase ID Token is verified by the backend.
        The Firebase UID is obtained from the verified token and
        used to identify the corresponding RailOpt-AI user.

        The client does not provide a user ID.

      responses:

        "200":
          description: Current user retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: "USR-1024"
                email: "planner@railway.gov.in"
                name: "Rahul Sharma"
                role: "PLANNER"
                department_id: "DEP-12"
                status: "ACTIVE"

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - User account is inactive or suspended

        "404":
          description: RailOpt-AI user record not found


    patch:
      tags:
        - User

      summary: Update current user's profile

      description: |
        Updates editable profile information of the currently
        authenticated user.

        The user's identity is obtained from the verified Firebase
        ID Token.

        System-controlled information such as user ID, Firebase UID,
        role, department and account status cannot be changed through
        this endpoint.

      requestBody:
        required: true
        content:
          application/json:
            example:
              name: "Rahul Sharma"

      responses:

        "200":
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: "USR-1024"
                name: "Rahul Sharma"
                email: "planner@railway.gov.in"

        "400":
          description: Invalid profile data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - User account is inactive or suspended

        "404":
          description: User record not found


  /user:

    post:
      tags:
        - User

      summary: Create RailOpt-AI user

      description: |
        Creates the RailOpt-AI application user corresponding to
        the currently authenticated Firebase account.

        This endpoint does not create a Firebase account.

        Firebase Authentication handles authentication.
        The Spring Boot backend creates the application-level user
        record after verifying the Firebase ID Token.

        The Firebase UID is obtained from the verified token and
        must not be supplied by the client.

      requestBody:
        required: true
        content:
          application/json:
            example:
              name: "Rahul Sharma"
              email: "planner@railway.gov.in"

      responses:

        "201":
          description: RailOpt-AI user created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: "USR-1024"
                name: "Rahul Sharma"
                email: "planner@railway.gov.in"
                status: "ACTIVE"

        "400":
          description: Invalid user data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - User does not have permission to create users

        "409":
          description: User already exists for the authenticated Firebase account


    get:
      tags:
        - User

      summary: List users

      description: |
        Returns a paginated list of RailOpt-AI users.

        Intended for authorized administrative users.

        Users can be filtered using role, department and account status.

      parameters:

        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Filter users by role
          example: "PLANNER"

        - name: department_id
          in: query
          required: false
          schema:
            type: string
          description: Filter users by department
          example: "DEP-12"

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter users by account status
          example: "ACTIVE"

        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search users by name or email
          example: "Rahul"

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of users per page

      responses:

        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

        "400":
          description: Invalid query parameters

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions to list users


  /user/{userId}:

    get:
      tags:
        - User

      summary: Get user by ID

      description: |
        Returns selected information about a specific RailOpt-AI user.

        Administrative access may be required depending on the
        authenticated user's role.

      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: RailOpt-AI user identifier
          example: "USR-1024"

      responses:

        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: "USR-1024"
                name: "Rahul Sharma"
                email: "planner@railway.gov.in"
                role: "PLANNER"
                department_id: "DEP-12"
                status: "ACTIVE"

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions

        "404":
          description: User not found


    patch:
      tags:
        - User

      summary: Update user

      description: |
        Updates manageable information of a specific RailOpt-AI user.

        This operation is restricted to authorized administrative users.

        Authentication-related information and system-controlled
        identifiers cannot be changed through this endpoint.

      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "USR-1024"

      requestBody:
        required: true
        content:
          application/json:
            example:
              name: "Rahul Sharma"

      responses:

        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "400":
          description: Invalid user data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions

        "404":
          description: User not found

        "409":
          description: User update conflicts with existing data


  /user/{userId}/role:

    patch:
      tags:
        - User

      summary: Update user role

      description: |
        Assigns or changes the application role of a RailOpt-AI user.

        This operation is restricted to authorized administrative users.

      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "USR-1024"

      requestBody:
        required: true
        content:
          application/json:
            example:
              role: "PLANNER"

      responses:

        "200":
          description: User role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "400":
          description: Invalid or unsupported role

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions to change user roles

        "404":
          description: User not found

        "409":
          description: Role assignment conflicts with the current user state


  /user/{userId}/department:

    patch:
      tags:
        - User

      summary: Assign user to department

      description: |
        Assigns a RailOpt-AI user to a department.

        This operation is restricted to authorized administrative users.

      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "USR-1024"

      requestBody:
        required: true
        content:
          application/json:
            example:
              department_id: "DEP-12"

      responses:

        "200":
          description: User department updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "400":
          description: Invalid department data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions to assign departments

        "404":
          description: User or department not found

        "409":
          description: Department assignment conflicts with the current user state


  /user/{userId}/status:

    patch:
      tags:
        - User

      summary: Update user status

      description: |
        Changes the application status of a RailOpt-AI user.

        This does not modify the Firebase Authentication account.

        Deactivating the application user prevents access to
        protected RailOpt-AI operations.

      parameters:

        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "USR-1024"

      requestBody:
        required: true
        content:
          application/json:
            example:
              status: "INACTIVE"

      responses:

        "200":
          description: User status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

        "400":
          description: Invalid user status

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions to change user status

        "404":
          description: User not found

        "409":
          description: Status change conflicts with the current user state


  # ===================================================
  # ORGANIZATION / DEPARTMENT MODULE
  # ===================================================


  /department:

    get:
      tags:
        - Organization

      summary: List departments

      description: |
        Returns a list of departments available in RailOpt-AI.

        Supports filtering by status and pagination.

      parameters:

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter departments by status
          example: "ACTIVE"

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of departments per page

      responses:

        "200":
          description: Departments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "DEP-12"

                    name:
                      type: string
                      example: "Track Maintenance"

                    status:
                      type: string
                      example: "ACTIVE"

        "400":
          description: Invalid query parameters

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions


    post:
      tags:
        - Organization

      summary: Create department

      description: |
        Creates a new department in RailOpt-AI.

        This operation is restricted to authorized administrative users.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:

                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Department name
                  example: "Track Maintenance"

      responses:

        "201":
          description: Department created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResponse"

        "400":
          description: Invalid department data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions to create departments

        "409":
          description: Department with the same name already exists


  /department/{departmentId}:

    get:
      tags:
        - Organization

      summary: Get department by ID

      description: |
        Returns details of a specific department.

      parameters:

        - name: departmentId
          in: path
          required: true
          schema:
            type: string
          description: Department identifier
          example: "DEP-12"

      responses:

        "200":
          description: Department retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "DEP-12"

                  name:
                    type: string
                    example: "Track Maintenance"

                  status:
                    type: string
                    example: "ACTIVE"

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Department not found


    patch:
      tags:
        - Organization

      summary: Update department

      description: |
        Updates the editable information of a department.

        This operation is restricted to authorized administrative users.

      parameters:

        - name: departmentId
          in: path
          required: true
          schema:
            type: string
          description: Department identifier
          example: "DEP-12"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:

                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Department name
                  example: "Permanent Way Maintenance"

      responses:

        "200":
          description: Department updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResponse"

        "400":
          description: Invalid department data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Department not found

        "409":
          description: Department name already exists


    delete:
      tags:
        - Organization

      summary: Deactivate department

      description: |
        Deactivates a department.

        The department is not physically deleted if it is referenced
        by existing users or operational records.

      parameters:

        - name: departmentId
          in: path
          required: true
          schema:
            type: string
          description: Department identifier
          example: "DEP-12"

      responses:

        "204":
          description: Department deactivated successfully

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Department not found

        "409":
          description: Department cannot be deactivated because it is referenced by active records



  # ===================================================
  # INFRASTRUCTURE MODULE
  # ===================================================


  /infrastructure/sections:

    get:
      tags:
        - Infrastructure

      summary: List railway sections

      description: |
        Returns railway sections available in RailOpt-AI.

        Supports filtering by status and pagination.

      parameters:

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter sections by status
          example: "ACTIVE"

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of sections per page

      responses:

        "200":
          description: Sections retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionResponse"

        "400":
          description: Invalid query parameters

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions


    post:
      tags:
        - Infrastructure

      summary: Create railway section

      description: |
        Creates a new railway section in RailOpt-AI.

        This operation is restricted to authorized users.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:

                name:
                  type: string
                  description: Railway section name
                  example: "Pune - Daund"

                code:
                  type: string
                  description: Unique section code
                  example: "PN-DN"

      responses:

        "201":
          description: Railway section created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"

        "400":
          description: Invalid section data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "409":
          description: Section with the same identifier already exists


  /infrastructure/sections/{sectionId}:

    get:
      tags:
        - Infrastructure

      summary: Get railway section

      description: |
        Returns details of a specific railway section.

      parameters:

        - name: sectionId
          in: path
          required: true
          schema:
            type: string
          description: Railway section identifier
          example: "SEC-101"

      responses:

        "200":
          description: Railway section retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Railway section not found


    patch:
      tags:
        - Infrastructure

      summary: Update railway section

      parameters:

        - name: sectionId
          in: path
          required: true
          schema:
            type: string
          description: Railway section identifier
          example: "SEC-101"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:

                name:
                  type: string
                  description: Railway section name
                  example: "Pune - Daund"

                code:
                  type: string
                  description: Unique section code
                  example: "PN-DN"

      responses:

        "200":
          description: Railway section updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"

        "400":
          description: Invalid section data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Railway section not found

        "409":
          description: Section identifier already exists


    delete:
      tags:
        - Infrastructure

      summary: Deactivate railway section

      parameters:

        - name: sectionId
          in: path
          required: true
          schema:
            type: string
          description: Railway section identifier
          example: "SEC-101"

      responses:

        "204":
          description: Railway section deactivated successfully

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Railway section not found

        "409":
          description: Section cannot be deactivated because it is referenced by active infrastructure or operational records


  /infrastructure/sections/{sectionId}/tracks:

    get:
      tags:
        - Infrastructure

      summary: List tracks in a railway section

      description: |
        Returns the tracks belonging to the specified railway section.

      parameters:

        - name: sectionId
          in: path
          required: true
          schema:
            type: string
          description: Railway section identifier
          example: "SEC-101"

      responses:

        "200":
          description: Tracks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackResponse"

        "401":
