        track_section_id:
          type: string
          format: uuid
          nullable: true
          description: Track section associated with the asset
          example: "c3f9d25c-712d-4f9c-af7b-1a9e7d8d5a03"
        station_id:
          type: string
          format: uuid
          nullable: true
          description: Station associated with the asset
          example: "d4a0e36d-823e-4a0d-b08c-2b0f8e9e6b04"
        code:
          type: string
          description: Unique asset code
          example: "SIG-102"
        name:
          type: string
          description: Asset name
          example: "Signal S-102"
        status:
          type: string
          description: Operational status of the asset
          example: "OPERATIONAL"
        criticality:
          type: string
          description: Criticality level
          example: "HIGH"

