      parameters:

        - name: stationId
          in: path
          required: true
          schema:
            type: string
          description: Station identifier
          example: "STN-101"

        - name: asset_type_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by asset type
          example: "AT-01"

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by asset status
          example: "ACTIVE"

      responses:

        "200":
          description: Assets retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetResponse"

        "400":
          description: Invalid station identifier

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Station not found



  # =====================================================
  # MAINTENANCE MODULE
  # =====================================================


  /maintenance:

    get:
      tags:
        - Maintenance

      summary: List maintenance records

      description: |
        Returns a paginated list of maintenance records.

        Records can be filtered by asset, maintenance status,
        maintenance type and planned date range.

      parameters:

        - name: asset_id
          in: query
          required: false
          schema:
            type: string
          description: Filter maintenance records by asset
          example: "AST-1024"

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by maintenance status
          example: "SCHEDULED"

        - name: maintenance_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by maintenance type
          example: "PREVENTIVE"

        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return records scheduled from this time
          example: "2026-09-10T00:00:00Z"

        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return records scheduled until this time
          example: "2026-09-20T23:59:59Z"

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Page number

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of records per page

      responses:

        "200":
          description: Maintenance records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceTaskResponse"

        "400":
          description: Invalid query parameters

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions


    post:
      tags:
        - Maintenance

      summary: Create maintenance record

      description: |
        Creates a maintenance record for a railway asset.

        The referenced asset must exist in RailOpt-AI.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_id
                - maintenance_type
              properties:

                asset_id:
                  type: string
                  description: Asset requiring maintenance
                  example: "AST-1024"

                maintenance_type:
                  type: string
                  description: Type of maintenance
                  example: "PREVENTIVE"

                scheduled_start:
                  type: string
                  format: date-time
                  description: Planned maintenance start time
                  example: "2026-09-15T22:00:00Z"

                scheduled_end:
                  type: string
                  format: date-time
                  description: Planned maintenance end time
                  example: "2026-09-16T04:00:00Z"

                description:
                  type: string
                  description: Description of maintenance work
                  example: "Routine signal inspection"

      responses:

        "201":
          description: Maintenance record created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTaskResponse"

        "400":
          description: Invalid maintenance data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Asset not found

        "409":
          description: Maintenance record conflicts with an existing maintenance record


  /maintenance/{maintenanceId}:

    get:
      tags:
        - Maintenance

      summary: Get maintenance record

      description: |
        Returns details of a specific maintenance record.

      parameters:

        - name: maintenanceId
          in: path
          required: true
          schema:
            type: string
          description: Maintenance record identifier
          example: "MNT-1024"

      responses:

        "200":
          description: Maintenance record retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTaskResponse"

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Forbidden - Insufficient permissions

        "404":
          description: Maintenance record not found


    patch:
      tags:
        - Maintenance

      summary: Update maintenance record

      description: |
        Updates editable information of a maintenance record.

        Changes affecting operational availability or planned
        maintenance windows may require appropriate authorization.

      parameters:

        - name: maintenanceId
          in: path
          required: true
          schema:
            type: string
          description: Maintenance record identifier
          example: "MNT-1024"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:

                maintenance_type:
                  type: string
                  example: "CORRECTIVE"

                scheduled_start:
                  type: string
                  format: date-time
                  example: "2026-09-15T22:00:00Z"

                scheduled_end:
                  type: string
                  format: date-time
                  example: "2026-09-16T04:00:00Z"

                description:
                  type: string
                  example: "Signal inspection and component replacement"

      responses:

        "200":
          description: Maintenance record updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTaskResponse"

        "400":
          description: Invalid maintenance data

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions

        "404":
          description: Maintenance record not found

        "409":
          description: Updated maintenance window conflicts with another maintenance record


    delete:
      tags:
        - Maintenance

      summary: Cancel maintenance record

      description: |
        Cancels an existing maintenance record.

        Historical maintenance information should be retained
        rather than physically deleting completed maintenance
        records.

      parameters:

        - name: maintenanceId
          in: path
          required: true
          schema:
            type: string
          description: Maintenance record identifier
          example: "MNT-1024"

      responses:

        "204":
          description: Maintenance record cancelled successfully

        "401":
          description: Unauthorized - Missing, invalid, or expired Firebase ID Token

        "403":
          description: Insufficient permissions

        "404":
          description: Maintenance record not found

        "409":
          description: Maintenance record cannot be cancelled in its current state


  /maintenance/by-asset/{assetId}:

    get:
      tags:
        - Maintenance

      summary: List maintenance records for an asset

      description: |
        Returns maintenance records associated with a specific asset.

        This endpoint can be used from the asset details screen
        to display relevant maintenance information.

      parameters:

        - name: assetId
          in: path
          required: true
          schema:
            type: string
          description: Asset identifier
          example: "AST-1024"

        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter maintenance records by status
          example: "SCHEDULED"

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:

        "200":
          description: Asset maintenance records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceTaskResponse"

        "400":
          description: Invalid asset identifier

        "401":
