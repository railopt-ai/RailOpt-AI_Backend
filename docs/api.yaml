          description: Unique route stop identifier
          example: "c9f5d81c-378d-4f5c-a53b-7a5e3d4d1a09"
        route_id:
          type: string
          format: uuid
          description: Route identifier
          example: "b8e4c70b-267c-4e4b-f42a-6f4d2c3c0f08"
        station_id:
          type: string
          format: uuid
          description: Station identifier
          example: "d4a0e36d-823e-4a0d-b08c-2b0f8e9e6b04"
        sequence_no:
          type: integer
          description: Stop sequence number along route
          example: 1
        arrival_offset_minutes:
          type: integer
          description: Offset minutes from departure for arrival
          example: 0
        departure_offset_minutes:
          type: integer
          description: Offset minutes from departure
          example: 5

    TrainScheduleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique schedule identifier
          example: "da06e92d-489e-4a6d-b64c-8b6f4e5e2b10"
        train_id:
          type: string
          format: uuid
          description: Train identifier
          example: "a7d3b69a-156b-4d3a-e31f-5e3c1b2b9e07"
        train_route_id:
          type: string
          format: uuid
          description: Train route identifier
          example: "b8e4c70b-267c-4e4b-f42a-6f4d2c3c0f08"
        schedule_code:
          type: string
          description: Schedule code
          example: "SCH-12123-D"
        valid_from:
          type: string
          format: date
          description: Start of validity period
          example: "2026-01-01"
        valid_until:
          type: string
          format: date
          description: End of validity period
          example: "2026-12-31"
        operating_days:
          type: string
          description: Days of operation bitmask or string
          example: "DAILY"
        departure_time:
          type: string
          format: time
          description: Scheduled departure time
          example: "07:15:00"
        arrival_time:
          type: string
          format: time
          description: Scheduled arrival time
          example: "10:25:00"
        status:
          type: string
          description: Schedule status
          example: "ACTIVE"

    TrainRunResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique train run identifier
          example: "eb17f03e-590f-4b7e-c75d-9c7a5f6f3c11"
        train_id:
          type: string
          format: uuid
          description: Train identifier
          example: "a7d3b69a-156b-4d3a-e31f-5e3c1b2b9e07"
        train_route_id:
