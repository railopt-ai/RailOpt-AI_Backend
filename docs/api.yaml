          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"

    GraphNode:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the infrastructure node
          example: "STN-101"
        type:
          type: string
          description: Type of infrastructure element
          example: "STATION"
        name:
          type: string
          description: Display name of the infrastructure element
          example: "Pune"
        status:
          type: string
          description: Operational status
          example: "ACTIVE"

    GraphEdge:
      type: object
      properties:
        source:
          type: string
          description: Identifier of the source node
          example: "STN-101"
        target:
          type: string
          description: Identifier of the target node
          example: "TRK-201"
        type:
          type: string
          description: Type of relationship
          example: "CONNECTED_TO"

    AssetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique asset identifier
          example: "b1f7d23a-590b-4d7a-8d5f-9e7c5b6b3e01"
